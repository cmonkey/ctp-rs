[package]
authors = ["Ruiqi Lei <Rn7s2@outlook.com>"]
categories = ["api-bindings", "finance"]
description = "Safe & Idiomatic Rust bindings for CTP"
edition = "2024"
keywords = ["ctp", "ctp-rs", "ctp2rs", "ctp-binding", "quant"]
license = "MIT"
name = "ctp-rs"
readme = "README.md"
repository = "https://github.com/rn7s2/ctp-rs"
version = "6.7.11+refined.20251214"

[features]
# 2026-08-30 切到 6.7.13:券商已确认支持;A4~A7 协议层接入完成并在 dev 7x24
# 实测登录/行情/账户全通;6.7.11 也单独编译通过(证明 stub 分支与版本门控
# 正确)。低版本 feature 保留,`./build.sh 6.7.10|6.7.11` 仍可用。
default = ["ctp-6-7-13"]
ctp-6-7-13 = []
ctp-6-7-11 = []
ctp-6-7-10 = []

[dependencies]
cxx = "1.0"

# 只给 examples/private_seq_probe.rs 用(读 config.json 拿 7x24 凭据,
# 不硬编码)。dev-dependency 不进生产二进制。
[dev-dependencies]
serde_json = "1"

[build-dependencies]
cxx-build = "1.0"
